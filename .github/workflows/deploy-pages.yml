name: Deploy prototype to GitHub Pages

# Публикация через ветку gh-pages: при её создании GitHub включает Pages
# автоматически, без прав администратора у встроенного токена.

on:
  push:
    branches:
      - claude/magical-hamilton-rwy6c2
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'
          force_orphan: true
